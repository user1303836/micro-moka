name: Miri tests

on:
  push:
    paths-ignore:
      - '.devcontainer/**'
      - '.gitpod.yml'
      - '.vscode/**'
      - 'tests/**'
  pull_request:
    paths-ignore:
      - '.devcontainer/**'
      - '.gitpod.yml'
      - '.vscode/**'
      - 'tests/**'
  schedule:
    - cron: '0 21 * * 5'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust nightly with Miri
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
          components: miri

      - name: Run Miri tests
        run: cargo miri test --lib --all-features
