[package]
name = "micro-moka"
version = "1.2.0"
edition = "2021"
rust-version = "1.76"

description = "A predictable, safe-Rust single-threaded cache with bounded SIEVE admission"
license = "MIT OR Apache-2.0"
# homepage = "https://"
documentation = "https://docs.rs/micro-moka/"
repository = "https://github.com/user1303836/micro-moka"
keywords = ["cache", "sieve", "latency"]
categories = ["caching"]
readme = "README.md"
exclude = [".circleci", ".devcontainer", ".github", ".gitpod.yml", ".vscode"]

[dependencies]
hashbrown = { version = "0.16", default-features = false, features = ["inline-more"] }

[target.'cfg(bench_deps)'.dev-dependencies]
quick_cache = "=0.7.0"
lru = "=0.18.1"
hashlink = "=0.12.1"
mini-moka = "=0.10.3"
sieve-cache = "=1.1.6"
senba = "=0.2.0"
rand = "=0.10.2"
rand_distr = "=0.6.0"
ahash = "=0.8.12"

[[bench]]
name = "benchmark"
harness = false

# https://docs.rs/about/metadata
[package.metadata.docs.rs]
# Build the doc with some features enabled.
features = []
rustdoc-args = ["--cfg", "docsrs"]

[profile.release]
lto = true
codegen-units = 1

[profile.bench]
lto = true
codegen-units = 1

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    "cfg(bench_deps)",
] }
