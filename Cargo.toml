[package]
name = "micro-moka"
version = "0.1.20"
edition = "2018"
rust-version = "1.76"

description = "A lightweight, single-threaded cache library with SIEVE eviction"
license = "MIT OR Apache-2.0"
# homepage = "https://"
documentation = "https://docs.rs/micro-moka/"
repository = "https://github.com/user1303836/micro-moka"
keywords = ["cache"]
categories = ["caching"]
readme = "README.md"
exclude = [".circleci", ".devcontainer", ".github", ".gitpod.yml", ".vscode"]

[dependencies]
hashbrown = { version = "0.16", default-features = false, features = ["inline-more"] }

[dev-dependencies]
anyhow = "1.0.19"
getrandom = "0.2"
once_cell = "1.7"

[target.'cfg(bench_deps)'.dev-dependencies]
quick_cache = "0.6"
lru = "0.12"
hashlink = "0.11"
mini-moka = "0.10"
rand = "0.8"
rand_distr = "0.4"
ahash = "0.8.11"  # floor pin: 0.8.4 fails on nightly (removed stdsimd feature)

[[bench]]
name = "benchmark"
harness = false

[target.'cfg(trybuild)'.dev-dependencies]
trybuild = "1.0.103"

# https://docs.rs/about/metadata
[package.metadata.docs.rs]
# Build the doc with some features enabled.
features = []
rustdoc-args = ["--cfg", "docsrs"]

[profile.release]
lto = true
codegen-units = 1

[profile.bench]
lto = true
codegen-units = 1

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    "cfg(kani)",
    "cfg(skeptic)",
    "cfg(circleci)",
    "cfg(trybuild)",
    "cfg(beta_clippy)",
    "cfg(bench_deps)",
] }
