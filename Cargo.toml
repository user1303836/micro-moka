[package]
name = "micro-moka"
version = "1.2.0"
edition = "2021"
rust-version = "1.76"
autobenches = false

description = "A predictable, safe-Rust single-threaded cache with bounded SIEVE admission"
license = "MIT OR Apache-2.0"
# homepage = "https://"
documentation = "https://docs.rs/micro-moka/"
repository = "https://github.com/user1303836/micro-moka"
keywords = ["cache", "sieve", "latency"]
categories = ["caching"]
readme = "README.md"
exclude = [
    ".circleci",
    ".devcontainer",
    ".github",
    ".gitpod.yml",
    ".vscode",
    "benches",
]

[dependencies]
hashbrown = { version = "0.16", default-features = false, features = ["inline-more"] }

# https://docs.rs/about/metadata
[package.metadata.docs.rs]
# Build the doc with some features enabled.
features = []
rustdoc-args = ["--cfg", "docsrs"]

[profile.release]
lto = true
codegen-units = 1
